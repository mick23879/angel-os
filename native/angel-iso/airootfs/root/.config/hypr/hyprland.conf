monitor=,preferred,auto,1

exec-once = swaybg -i /usr/share/backgrounds/angel/angel.png -m fill
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = angel-autopower
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

env = LIBVA_DRIVER_NAME,iHD
env = XDG_CURRENT_DESKTOP,Hyprland

$mod = SUPER
bind = $mod, RETURN, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, E, exec, thunar
bind = $mod, B, exec, firefox
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F1, exec, angel-power eco
bind = $mod, F2, exec, angel-power bal
bind = $mod, F3, exec, angel-power perf

# Raccourcis de secours si la touche Windows ne fonctionne pas (touche Alt)
bind = ALT, RETURN, exec, foot
bind = ALT, D, exec, wofi --show drun
bind = ALT, E, exec, thunar
bind = ALT, B, exec, firefox
bind = ALT SHIFT, Q, killactive
bind = ALT SHIFT, E, exit
bind = , Print, exec, grim -g "$(slurp)" ~/capture.png
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

general {
  gaps_in = 5
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(7c3affee) rgba(2f8cffee) 45deg
  col.inactive_border = rgba(44445588)
}
decoration {
  rounding = 10
  blur {
    enabled = true
    size = 4
    passes = 2
  }
  shadow {
    enabled = true
    range = 14
    render_power = 2
    color = rgba(00000055)
  }
}
animations {
  enabled = yes
  bezier = ease, 0.2, 0.9, 0.25, 1.05
  animation = windows, 1, 4, ease
  animation = fade, 1, 5, ease
  animation = workspaces, 1, 4, ease
}
misc {
  vfr = true
  disable_hyprland_logo = true
  disable_splash_rendering = true
}
