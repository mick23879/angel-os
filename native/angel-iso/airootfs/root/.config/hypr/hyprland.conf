monitor=,preferred,auto,1

exec-once = swaybg -i /usr/share/backgrounds/angel/angel.png -m fill
exec-once = foot

$mod = SUPER
bind = $mod, RETURN, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit

general {
  gaps_in = 5
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(7c3affee) rgba(2f8cffee) 45deg
}
decoration {
  rounding = 10
  blur { enabled = true; size = 4; passes = 2 }
}
animations {
  enabled = yes
  bezier = ease, 0.2, 0.9, 0.25, 1.05
  animation = windows, 1, 4, ease
  animation = fade, 1, 5, ease
  animation = workspaces, 1, 4, ease
}
misc {
  vfr = true
  disable_hyprland_logo = true
}
